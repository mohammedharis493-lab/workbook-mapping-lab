[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "winman-fs-mapper"
version = "0.1.0"
description = "Local-first FS to Winman field mapping with human-approved exceptions"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
